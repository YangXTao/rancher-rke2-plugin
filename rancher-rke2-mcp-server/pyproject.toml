[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rancher-rke2-mcp-server"
version = "0.3.0"
description = "Secret-reference-only planning and non-mutating preflight MCP server for Rancher and RKE2 automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]==2.0.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
rancher-rke2-mcp = "rancher_rke2_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rancher_rke2_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
