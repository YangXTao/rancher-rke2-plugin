services:
  rancher-rke2-mcp:
    build:
      context: .
    image: rancher-rke2-mcp-server:0.6.2
    restart: unless-stopped
    environment:
      RANCHER_RKE2_MCP_HOST: "${RANCHER_RKE2_MCP_HOST:-0.0.0.0}"
      RANCHER_RKE2_MCP_PORT: "${RANCHER_RKE2_MCP_PORT:-8787}"
      RANCHER_RKE2_MCP_DB: "${RANCHER_RKE2_MCP_DB:-/data/state.db}"
      RANCHER_RKE2_MCP_LOG_LEVEL: "${RANCHER_RKE2_MCP_LOG_LEVEL:-INFO}"
      RANCHER_RKE2_MCP_TOKEN_FILE: "${RANCHER_RKE2_MCP_TOKEN_FILE:-/run/secrets/mcp_bearer_token}"
      RANCHER_RKE2_SECRET_ROOT: /run/secrets
      RANCHER_RKE2_CONTROL_KNOWN_HOSTS: /run/secrets/control_host_known_hosts
    expose:
      - "8787"
    volumes:
      - rancher-rke2-mcp-data:/data
    secrets:
      - mcp_bearer_token
      - control_host_password
      - node_password
      - vsphere_password
      - rancher_bootstrap_password
      - proxy_password
      - registry_password
      - control_host_known_hosts
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8787),2); s.close()"
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s

  rancher-rke2-mcp-proxy:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    profiles:
      - https
    depends_on:
      - rancher-rke2-mcp
    ports:
      - "${MCP_HTTPS_BIND_ADDRESS:-0.0.0.0}:${MCP_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./tls/server.key:/etc/nginx/tls/server.key:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5

volumes:
  rancher-rke2-mcp-data:
    name: rancher-rke2-mcp-data

secrets:
  mcp_bearer_token:
    file: ./secrets/mcp_bearer_token
  control_host_password:
    file: ./secrets/control_host_password
  node_password:
    file: ./secrets/node_password
  vsphere_password:
    file: ./secrets/vsphere_password
  rancher_bootstrap_password:
    file: ./secrets/rancher_bootstrap_password
  proxy_password:
    file: ./secrets/proxy_password
  registry_password:
    file: ./secrets/registry_password
  control_host_known_hosts:
    file: ./secrets/control_host_known_hosts
