run:
  run_id: auto
  components: all
  workspace: /data/rancher/automation

execution:
  control_host:
    address: "192.0.2.10"
    port: 22
    username: root
    password_ref: "docker-secret://control_host_password"
  container:
    strategy: reuse-or-create
    name: rancher-rke2-control
    # Mirror the release image into the same internal Harbor used below.
    image: registry.example.internal/automation/rancher-rke2-control:0.12.0
    image_archive: "" # Optional fallback, for example /software/control-container/images/control-0.12.0.tar
    image_pull_policy: if-not-present
    allow_offline_registry_pull: true
    network: host
    restart_policy: unless-stopped
    mounts:
      software: /software
      workspace: /data/rancher/automation
    docker:
      version: 20.10.24
      archive: /software/docker/docker-20.10.24.tgz
      url: https://rancher.blob.core.chinacloudapi.cn/docker/docker-20.10.24.tgz

node_access:
  username: root
  port: 22
  password_ref: "docker-secret://node_password"

vsphere:
  server: "vcenter.example.internal"
  username: "administrator@vsphere.local"
  password_ref: "docker-secret://vsphere_password"
  allow_unverified_ssl: true
  datacenter: Datacenter
  resource_pool: RKE2-POOL
  datastore: DATASTORE01
  network: VLAN-RKE2
  template: linux-template

network:
  netmask: 24
  gateway: "192.0.2.1"
  dns_servers: ["192.0.2.53"]

nodes:
  management:
    servers:
      - {hostname: rancher01, ip: "192.0.2.21", cpu: 4, memory_mb: 8192, disk_gb: 100}
      - {hostname: rancher02, ip: "192.0.2.22", cpu: 4, memory_mb: 8192, disk_gb: 100}
      - {hostname: rancher03, ip: "192.0.2.23", cpu: 4, memory_mb: 8192, disk_gb: 100}
    load_balancer: {hostname: rancherlb, ip: "192.0.2.20", cpu: 2, memory_mb: 4096, disk_gb: 50}
  downstream:
    controlplane:
      - {hostname: master01, ip: "192.0.2.24", cpu: 4, memory_mb: 8192, disk_gb: 100}
      - {hostname: master02, ip: "192.0.2.25", cpu: 4, memory_mb: 8192, disk_gb: 100}
      - {hostname: master03, ip: "192.0.2.26", cpu: 4, memory_mb: 8192, disk_gb: 100}
    workers:
      - {hostname: worker01, ip: "192.0.2.27", cpu: 4, memory_mb: 8192, disk_gb: 100}
      - {hostname: worker02, ip: "192.0.2.28", cpu: 4, memory_mb: 8192, disk_gb: 100}
      - {hostname: worker03, ip: "192.0.2.29", cpu: 4, memory_mb: 8192, disk_gb: 100}

downloads:
  mode: online
  proxy_url: ""
  software_root: /software

registry:
  hostname: registry.example.internal
  username: null
  password_ref: null
  insecure_skip_verify: true

versions:
  terraform: "1.14.7"
  vsphere_provider: "2.15.0"
  rke2_management: "v1.34.8+rke2r2"
  rancher: "2.13.6-ent"
  rancher2_provider: "13.1.4"
  rke2_downstream: "v1.34.8+rke2r2"

local_rke2:
  cni: cilium
  disable_kube_proxy: false
  # registries 省略时使用参考默认：启用 Harbor（registry.hostname）+ myharbor-auth
  # + 完整镜像集（docker.io 无 rewrites；Rancher 域按版本选择，ent->registry.rancher.cn，非 ent->registry.rancher.com）。
  # 除非手工覆盖，否则无需填写

rancher:
  bootstrap_password_ref: "docker-secret://rancher_bootstrap_password"
  nodeport: 30080
  replicas: 3
  # Rancher Helm 安装参数参考（实际执行使用已验证 skill 资产中的同参数）：
  # standard:
  #   helm upgrade --install rancher "${RANCHER_CHART}" --namespace cattle-system \
  #     --create-namespace \
  #     --set-string hostname="${RANCHER_HOSTNAME}" \
  #     --set-string bootstrapPassword="${RANCHER_BOOTSTRAP_PASSWORD}" \
  #     --set tls=external --set privateCA=true --set ingress.enabled=false \
  #     --set service.type=ClusterIP --set useBundledSystemChart=true \
  #     --set additionalTrustedCAs=false --set replicas=3 \
  #     --set-string rancherImage="${RANCHER_IMAGE}" \
  #     --kubeconfig "${RANCHER_KUBECONFIG}" --wait --timeout 15m
  # enterprise:
  #   helm upgrade --install rancher "${RANCHER_CHART}" --namespace cattle-system \
  #     --create-namespace \
  #     --set auditLog.enabled=true --set auditLog.destination=hostPath \
  #     --set auditLog.maxAge=180 --set auditLog.level=3 \
  #     --set-string hostname="${RANCHER_HOSTNAME}" \
  #     --set-string bootstrapPassword="${RANCHER_BOOTSTRAP_PASSWORD}" \
  #     --set tls=external --set privateCA=true --set ingress.enabled=false \
  #     --set service.type=NodePort --set service.nodePort="${RANCHER_HTTP_NODEPORT}" \
  #     --set useBundledSystemChart=true --set additionalTrustedCAs=false \
  #     --set replicas=3 \
  #     --set-string rancherImage="${RANCHER_IMAGE}" \
  #     --set-string postDelete.image.repository="${POST_DELETE_IMAGE}" \
  #     --kubeconfig "${RANCHER_KUBECONFIG}" --wait --timeout 15m

downstream_cluster:
  name: downstream
  registration:
    order: [first-controlplane, first-worker, remaining-controlplanes, remaining-workers]
  # Complete rkeConfig set this automation expects the user to customize.
  # When omitted, the validated reference defaults below are used.
  rke_config:
    chartValues:
      rke2-cilium:
        hubble:
          enabled: true
          metrics:
            enableOpenMetrics: true
            enabled:
              - "dns:query;ignoreAAAA"
              - drop
              - tcp
              - flow
              - icmp
              - http
              - port-distribution
          relay:
            enabled: true
          ui:
            enabled: true
        k8sServiceHost: 127.0.0.1
        k8sServicePort: "6443"
        kubeProxyReplacement: true
    etcd:
      disableSnapshots: false
      snapshotRetention: 5
      snapshotScheduleCron: "0 */5 * * *"
    machineGlobalConfig:
      cluster-cidr: 10.42.0.0/16
      cluster-dns: 10.43.0.10
      cni: cilium
      disable-kube-proxy: true
      etcd-arg:
        - "--auto-compaction-mode=periodic"
        - "--auto-compaction-retention=1h0m0s"
        - "--quota-backend-bytes=6442450944"
      kube-apiserver-arg:
        - "--watch-cache=true"
        - "--default-watch-cache-size=200"
        - "--max-requests-inflight=400"
        - "--max-mutating-requests-inflight=200"
      kube-controller-manager-arg:
        - "--node-monitor-grace-period=20s"
        - "--node-startup-grace-period=30s"
      service-cidr: 10.43.0.0/16
    machinePools: null
    machineSelectorConfig:
      - config:
          kubelet-arg:
            - "kube-reserved=cpu=1,memory=2048Mi"
            - "system-reserved=cpu=1,memory=2048Mi"
            - "container-log-max-files=5"
            - "container-log-max-size=100Mi"
            - "cgroups-per-qos=true"
            - "enforce-node-allocatable=pods"
            - "eviction-hard=memory.available<256Mi,nodefs.available<10%,imagefs.available<15%,nodefs.inodesFree<5%"
            - "eviction-soft=memory.available<512Mi,nodefs.available<15%,imagefs.available<20%,nodefs.inodesFree<10%"
            - "eviction-soft-grace-period=memory.available=1m30s,nodefs.available=1m30s,imagefs.available=1m30s,nodefs.inodesFree=1m30s"
            - "eviction-max-pod-grace-period=30"
            - "eviction-pressure-transition-period=30s"
            - "max-open-files=1000000"
            - "registry-burst=10"
            - "registry-qps=0"
            - "serialize-image-pulls=false"
            - "sync-frequency=30s"
            - "max-pods=999"
          protect-kernel-defaults: false
  # registries 省略时使用参考默认：启用 Harbor（registry.hostname）+ myharbor-auth
  # + 完整镜像集（docker.io 无 rewrites；Rancher 域按版本选择，ent->registry.rancher.cn，非 ent->registry.rancher.com）。
  # 除非手工覆盖，否则无需填写
  registries:
    enabled: true
    systemDefaultRegistry: ""
    configs:
      - hostname: "registry.example.internal"
        authConfigSecretName: myharbor-auth
        tlsSecretName: ""
        caBundle: ""
        insecure: true
    mirrors:
      - {hostname: docker.io, endpoints: ["https://registry.example.internal"], rewrites: {}}
      - {hostname: dp.apps.rancher.io, endpoints: ["https://registry.example.internal"], rewrites: {"(^.+$)": "dp.apps.rancher.io/$1"}}
      - {hostname: ghcr.io, endpoints: ["https://ghcr.zscr.io"], rewrites: {}}
      - {hostname: k8s.gcr.io, endpoints: ["https://registry.example.internal"], rewrites: {"(^.+$)": "registry.k8s.io/$1"}}
      - {hostname: quay.io, endpoints: ["https://registry.example.internal"], rewrites: {"(^.+$)": "quay.io/$1"}}
      - {hostname: registry.k8s.io, endpoints: ["https://registry.example.internal"], rewrites: {"(^.+$)": "registry.k8s.io/$1"}}
      - {hostname: registry.rancher.cn, endpoints: ["https://registry.example.internal"], rewrites: {}}
      - {hostname: registry.suse.com, endpoints: ["https://registry.example.internal"], rewrites: {"(^.+$)": "registry.suse.com/$1"}}

deliverables:
  installation_manual: ask
  require_audit_pass: true
