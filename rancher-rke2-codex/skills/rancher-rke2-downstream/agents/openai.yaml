interface:
  display_name: "Rancher RKE2 Downstream"
  short_description: "Plan and execute downstream cluster registration."
  default_prompt: "Use $rancher-rke2-downstream to plan or run downstream cluster creation and registration through the configured MCP server."

dependencies:
  tools:
    - type: "mcp"
      value: "rancher-rke2"
      description: "Rancher/RKE2 domain automation server"
      transport: "streamable_http"
      url: "https://192.168.10.184:8443/mcp"

policy:
  allow_implicit_invocation: true
