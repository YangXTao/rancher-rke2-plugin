interface:
  display_name: "Rancher RKE2 Rancher"
  short_description: "Plan and execute Rancher installation and publication."
  default_prompt: "Use $rancher-rke2-rancher to plan or run Rancher installation and publication through the configured MCP server."

dependencies:
  tools:
    - type: "mcp"
      value: "rancher-rke2"
      description: "Rancher/RKE2 domain automation server"
      transport: "streamable_http"
      url: "https://192.168.10.184:8443/mcp"

policy:
  allow_implicit_invocation: true
