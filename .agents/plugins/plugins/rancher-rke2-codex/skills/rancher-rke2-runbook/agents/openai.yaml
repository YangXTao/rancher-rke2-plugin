interface:
  display_name: "Rancher RKE2 Runbook"
  short_description: "Generate an audited human-executable runbook."
  default_prompt: "Use $rancher-rke2-runbook to generate an audited human-executable runbook from an approved plan."

dependencies:
  tools:
    - type: "mcp"
      value: "rancher-rke2"
      description: "Rancher/RKE2 domain automation server"
      transport: "streamable_http"
      url: "https://192.168.10.184:8443/mcp"

policy:
  allow_implicit_invocation: true
